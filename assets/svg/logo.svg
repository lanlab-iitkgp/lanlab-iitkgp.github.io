<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="LAN Lab">
  <!-- LAN Lab mark — decide, act, transmit, learn: the amber agent takes
       the solid path (the dashed ghost is the counterfactual), the action
       radiates into the network as a radio beacon, and feedback returns
       to the agent. The hexagon boundary is the cellular-network cell;
       its dark fill keeps the mark legible on any background. -->
  <defs>
    <marker id="ax" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9"
            refX="0" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <polygon points="50,4 90,27 90,73 50,96 10,73 10,27"
           fill="#0f1419" stroke="#2dd4bf" stroke-width="4.5" stroke-linejoin="round"/>
  <g transform="translate(50 50) scale(0.72) translate(-49 -46)">
    <!-- counterfactual ghost branch -->
    <path d="M 22 56 C 38 60 50 68 61 74" fill="none" stroke="#2dd4bf" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="7 6" opacity="0.55"/>
    <circle cx="67" cy="77.5" r="5.5" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.55"/>
    <!-- factual action path into the beacon -->
    <path d="M 22 56 C 34 52 42 47 49.8 40.4" fill="none" stroke="#2dd4bf" stroke-width="5"
          stroke-linecap="round" marker-end="url(#ax)"/>
    <!-- radio arcs radiating from the beacon node -->
    <g fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round">
      <path d="M 74.6 26.6 A 13 13 0 0 0 64.3 17.2"/>
      <path d="M 82.3 24.6 A 21 21 0 0 0 65.6 9.3" opacity="0.55"/>
    </g>
    <circle cx="62" cy="30" r="6.5" fill="#2dd4bf"/>
    <!-- feedback returning to the agent -->
    <path d="M 54 22 C 42 11 27 14 20 40" fill="none" stroke="#2dd4bf" stroke-width="4.5"
          stroke-linecap="round" marker-end="url(#ax)"/>
    <circle cx="22" cy="56" r="8" fill="#f59e0b"/>
  </g>
</svg>
